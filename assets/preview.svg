<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Pocket Arcade: six tiny games - Snake, Tic Tac Toe, Memory Match, Whack-a-Hamster, Traffic Dodge and Bubble Shot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9efeb"/>
      <stop offset="1" stop-color="#d6e0f5"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="18" fill="url(#bg)"/>
  <text x="360" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" fill="#2f4858">🕹️ Pocket Arcade</text>
  <text x="360" y="80" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5b7083">Six tiny games, one tiny page</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="40" y="104" width="200" height="130" rx="16" fill="#ffffff" stroke="#d6e4e2"/>
      <rect x="40" y="104" width="200" height="130" rx="16" fill="#7fb7ae" opacity="0.22"/>
      <text x="140" y="166" font-size="44">🐍</text>
      <text x="140" y="198" font-size="16" font-weight="700" fill="#2f4858">Snake</text>
      <text x="140" y="218" font-size="12" fill="#5b7083">Eat, grow, don’t crash.</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="260" y="104" width="200" height="130" rx="16" fill="#ffffff" stroke="#d6e4e2"/>
      <rect x="260" y="104" width="200" height="130" rx="16" fill="#6b9ac4" opacity="0.22"/>
      <text x="360" y="166" font-size="44">❌</text>
      <text x="360" y="198" font-size="16" font-weight="700" fill="#2f4858">Tic Tac Toe</text>
      <text x="360" y="218" font-size="12" fill="#5b7083">Beat the computer.</text>
      <animateTransform attributeName="transform" type="translate" values="0 -3; 0 3; 0 -3" dur="4.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="480" y="104" width="200" height="130" rx="16" fill="#ffffff" stroke="#d6e4e2"/>
      <rect x="480" y="104" width="200" height="130" rx="16" fill="#e8c27a" opacity="0.22"/>
      <text x="580" y="166" font-size="44">🃏</text>
      <text x="580" y="198" font-size="16" font-weight="700" fill="#2f4858">Memory Match</text>
      <text x="580" y="218" font-size="12" fill="#5b7083">Find all the pairs.</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="40" y="254" width="200" height="130" rx="16" fill="#ffffff" stroke="#d6e4e2"/>
      <rect x="40" y="254" width="200" height="130" rx="16" fill="#e3a98a" opacity="0.22"/>
      <text x="140" y="316" font-size="44">🐹</text>
      <text x="140" y="348" font-size="16" font-weight="700" fill="#2f4858">Whack-a-Hamster</text>
      <text x="140" y="368" font-size="12" fill="#5b7083">Fast taps, 20 seconds.</text>
      <animateTransform attributeName="transform" type="translate" values="0 -3; 0 3; 0 -3" dur="4.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="260" y="254" width="200" height="130" rx="16" fill="#ffffff" stroke="#d6e4e2"/>
      <rect x="260" y="254" width="200" height="130" rx="16" fill="#e08a8a" opacity="0.22"/>
      <text x="360" y="316" font-size="44">🚗</text>
      <text x="360" y="348" font-size="16" font-weight="700" fill="#2f4858">Traffic Dodge</text>
      <text x="360" y="368" font-size="12" fill="#5b7083">Dodge cars, grab coins.</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="3.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="480" y="254" width="200" height="130" rx="16" fill="#ffffff" stroke="#d6e4e2"/>
      <rect x="480" y="254" width="200" height="130" rx="16" fill="#5fb4d8" opacity="0.22"/>
      <text x="580" y="316" font-size="44">🔵</text>
      <text x="580" y="348" font-size="16" font-weight="700" fill="#2f4858">Bubble Shot</text>
      <text x="580" y="368" font-size="12" fill="#5b7083">Match 3 to pop bubbles.</text>
      <animateTransform attributeName="transform" type="translate" values="0 -3; 0 3; 0 -3" dur="4.8s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
